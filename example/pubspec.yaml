name: flexi_board_example
description: Example app for flexi_board
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flexi_board:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
