name: flexi_board
description: >-
  Plug-and-play multi-board drag-and-drop for Flutter. Mechanism-first physics
  with optional default UI, 1..N boards, cross-board moves, WIP, and undo —
  flutter-only, state-management agnostic.
version: 0.1.0
homepage: https://github.com/ananta/flexi_board

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
