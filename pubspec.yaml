name: flexi_board
description: >-
  Plug-and-play multi-board drag-and-drop for Flutter. Mechanism-first physics
  with optional default UI, 1..N boards, cross-board moves, WIP, and undo —
  flutter-only, state-management agnostic.
version: 0.4.0
homepage: https://github.com/kikikimbing/flexi_board
repository: https://github.com/kikikimbing/flexi_board
issue_tracker: https://github.com/kikikimbing/flexi_board/issues
topics:
  - flutter
  - drag-and-drop
  - kanban
  - board
  - ui

environment:
  sdk: ^3.6.2
  flutter: ">=3.27.4"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

screenshots:
  - description: FlexiBoard multi-board drag-and-drop example on iOS.
    path: doc/flexiboard_example.png
